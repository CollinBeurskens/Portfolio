<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collin Beurskens | UI/UX Developer</title>
    <link rel="icon" type="image/png" href="images/Toto/1.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Prevent dragging of any element (text, images, etc.) */
            -webkit-user-drag: none;
            user-drag: none;
        }

        /* Root level scrollbar hiding to prevent browser-level scrollbar bugs */
        html {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
            overflow-x: hidden;
            overflow-y: auto;
        }

        html::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        body {
            width: 100%; /* Changed from 100vw to prevent horizontal overflow when scrollbar appears */
            min-height: 100vh;
            background-color: #faf8f5;
            color: #1a1a1a;
            cursor: none;
            font-family: 'Geist Pixel', 'Geist Mono', monospace;
            
            /* Allow vertical scrolling, strictly prevent horizontal scrolling */
            overflow-x: hidden;
            overflow-y: auto; 
            
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        /* Extra safety for body scrollbar hiding */
        body::-webkit-scrollbar {
            display: none;
        }

        /* Force custom cursor on all interactive elements */
        a, button, input, textarea, select, [role="button"] {
            cursor: none !important;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        /* Minimalistic Typography */
        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* Bio / Description Text */
        .bio {
            max-width: 800px;
        }

        .bio p {
            font-size: 1.15rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 1.25rem;
            font-weight: 400;
        }

        .bio p:last-child {
            margin-bottom: 0;
        }

        /* Call to Action Button */
        .cta-button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 14px 28px;
            background-color: #1a1a1a;
            color: #faf8f5;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 500;
            border: 1px solid #1a1a1a;
            border-radius: 0; /* Strictly no rounded borders */
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            background-color: transparent;
            color: #1a1a1a;
        }

        /* New Minimalistic Sections (Matching existing bio style) */
        .section {
            max-width: 800px;
            margin-top: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
        }

        /* Socials Styling */
        .socials-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            list-style: none;
        }

        .socials-list a {
            font-size: 1.15rem;
            color: #444;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .socials-list a:hover {
            color: #1a1a1a;
        }

        .experience-item {
            margin-bottom: 2rem;
        }

        .experience-item:last-child {
            margin-bottom: 0;
        }

        .experience-item .role {
            font-size: 1.15rem;
            color: #1a1a1a;
            font-weight: 400;
            margin-bottom: 0.25rem;
        }

        .experience-item .company {
            font-size: 1.15rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 0.25rem;
        }

        .experience-item .date {
            font-size: 1rem;
            color: #666;
        }

        /* Retro text selection */
        ::selection {
            background-color: #1a1a1a;
            color: #faf8f5;
        }

        ::-moz-selection {
            background-color: #1a1a1a;
            color: #faf8f5;
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 48px; 
            height: 48px; 
            background-image: url('images/cursor.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, 0%);
            will-change: transform;
            display: block;
            transition: background-image 0.1s ease; /* Smooth image swap */
        }

        /* Custom Cursor Hover State */
        .custom-cursor.hover {
            background-image: url('images/click.png');
        }

        .custom-cursor.hidden {
            display: none;
        }

        /* Toto Animation Container */
        .toto-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            z-index: 99998;
            pointer-events: none; /* Prevents interference with custom cursor */
            user-select: none;
        }

        .toto-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-user-drag: none; /* Prevents dragging the image */
            user-select: none;
        }

        /* ---------- Responsive: Tablet ---------- */
        @media (max-width: 900px) {
            h1 {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 1.3rem;
            }

            .container {
                padding: 30px;
            }
        }

        /* ---------- Responsive: Mobile (Hide custom cursor, restore default) ---------- */
        @media (max-width: 768px) {
            body {
                cursor: auto;
                padding-top: 6vh;
                padding-bottom: 6vh;
            }

            .custom-cursor {
                display: none !important;
            }

            a, button, input, textarea, select, [role="button"] {
                cursor: pointer !important;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 2.4rem;
            }

            .subtitle {
                font-size: 1.15rem;
                margin-bottom: 1.5rem;
            }

            .bio p {
                font-size: 1rem;
                margin-bottom: 1rem;
            }

            .cta-button {
                font-size: 1rem;
                padding: 12px 24px;
                margin-top: 1rem;
            }

            .section {
                margin-top: 2rem;
            }

            .section-title {
                font-size: 1.25rem;
                margin-bottom: 1rem;
            }

            .socials-list {
                gap: 1rem;
            }

            .socials-list a {
                font-size: 1rem;
            }

            .experience-item {
                margin-bottom: 1.5rem;
            }

            .experience-item .role,
            .experience-item .company {
                font-size: 1rem;
            }

            .experience-item .date {
                font-size: 0.9rem;
            }

            /* Adjust Toto size slightly for mobile */
            .toto-container {
                width: 48px;
                height: 48px;
                bottom: 20px;
                right: 20px;
            }
        }

        /* ---------- Responsive: Small Mobile ---------- */
        @media (max-width: 480px) {
            body {
                padding-top: 4vh;
                padding-bottom: 4vh;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .bio p {
                font-size: 0.95rem;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .socials-list {
                flex-direction: column;
                gap: 0.75rem;
            }
        }

        /* ---------- Hide custom cursor on touch devices ---------- */
        @media (hover: none) and (pointer: coarse) {
            body {
                cursor: auto;
            }

            .custom-cursor {
                display: none !important;
            }

            a, button, input, textarea, select, [role="button"] {
                cursor: pointer !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Collin Beurskens</h1>
        
        <div class="subtitle">UI/UX Developer</div>
        
        <div class="bio">
            <p id="bio-p1"></p>
            <p id="bio-p2"></p>
            
            <!-- Work with me Button -->
            <a href="mailto:cmwjbeurskens@gmail.com" class="cta-button">Work with me</a>
        </div>

        <!-- Socials Section -->
        <div class="section">
            <div class="section-title">Socials</div>
            <ul class="socials-list">
                <li><a href="https://github.com/CollinBeurskens" target="_blank">GitHub</a></li>
                <li><a href="https://x.com/collinotje" target="_blank">Twitter</a></li>
                <li><a href="mailto:cmwjbeurskens@gmail.com">Email</a></li>
            </ul>
        </div>

        <!-- School Section -->
        <div class="section">
            <div class="section-title">Education</div>
            <div class="experience-item">
                <div class="role">HAVO – Year 3</div>
                <div class="company">Trevianum</div>
                <div class="date">2023/2024</div>
            </div>
        </div>
    </div>

    <div class="custom-cursor" id="cursor"></div>

    <!-- Toto Animation Element -->
    <div class="toto-container">
        <img src="images/Toto/1.svg" alt="Toto" id="toto-image" class="toto-image">
    </div>

    <script>
        /* ---------- Dynamic Age & Text Injection ---------- */
        function getAge() {
            const birthDate = new Date('2010-12-29');
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }
        
        const age = getAge();
        
        document.getElementById('bio-p1').textContent = `hey, im collin. im ${age} years old and i've been designing and building websites for around 2 years. i started out experimenting with HTML and CSS and gradually got more into web design and development.`;
        document.getElementById('bio-p2').textContent = `i enjoy creating websites that look good, feel right and actually work well. im always working on new projects, trying things out and learning something new along the way.`;

        /* ---------- Disable right-click ---------- */
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        /* ---------- Prevent dragging of selected text or images ---------- */
        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
        });

        /* ---------- Cursor Logic (only runs if not a touch device) ---------- */
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        if (!isTouchDevice) {
            const cursor = document.getElementById('cursor');
            
            let mouseX = -1000;
            let mouseY = -1000;
            let cursorX = -1000;
            let cursorY = -1000;
            let isFirstMove = true;
            const ease = 0.25;

            document.addEventListener('mousemove', (e) => {
                if (isFirstMove) {
                    cursorX = e.clientX;
                    cursorY = e.clientY;
                    isFirstMove = false;
                }
                
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursor.classList.remove('hidden');
            });

            document.documentElement.addEventListener('pointerleave', () => {
                cursor.classList.add('hidden');
            });

            document.documentElement.addEventListener('pointerenter', () => {
                cursor.classList.remove('hidden');
            });

            window.addEventListener('blur', () => {
                cursor.classList.add('hidden');
            });

            function animateCursor() {
                cursorX += (mouseX - cursorX) * ease;
                cursorY += (mouseY - cursorY) * ease;
                cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, 0%)`;
                requestAnimationFrame(animateCursor);
            }
            animateCursor();

            /* ---------- Cursor Hover State Logic ---------- */
            const interactiveSelector = 'a, button, input, textarea, select, [role="button"]';

            document.addEventListener('mouseover', (e) => {
                if (e.target.closest(interactiveSelector)) {
                    cursor.classList.add('hover');
                }
            });

            document.addEventListener('mouseout', (e) => {
                // Only remove the hover class if we are truly leaving the interactive element 
                // (and not just moving to a child element inside it)
                if (!e.relatedTarget || !e.relatedTarget.closest(interactiveSelector)) {
                    cursor.classList.remove('hover');
                }
            });
        }

        /* ---------- Toto Animation Logic ---------- */
        const totoImages = ['images/Toto/1.svg', 'images/Toto/2.svg'];
        let totoIndex = 0;
        const totoImageEl = document.getElementById('toto-image');
        
        setInterval(() => {
            totoIndex = (totoIndex + 1) % totoImages.length;
            totoImageEl.src = totoImages[totoIndex];
        }, 300);
    </script>
</body>
</html>
