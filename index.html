<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Collin Beurskens | UI/UX Developer</title>
    <link rel="icon" type="image/png" href="images/Toto/1.svg">
    <meta property="og:title" content="Collin Beurskens">
    <meta property="og:description" content="Collin Beurskens Portfolio">
    <meta property="og:image" content="https://yourdomain.com/images/Toto/1.svg">
    <meta property="og:url" content="https://collinbeurskens.vercel.app/">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-drag: none;
            user-drag: none;
        }

        /* ---------- Root Configuration ---------- */
        :root {
            --cursor-image: url('images/cursor.png');
            --cursor-click-image: url('images/click.png');

            --cursor-width: 48px;
            --cursor-height: 48px;

            /* Adjust the actual click position */
            --cursor-hotspot-x: 10px;
            --cursor-hotspot-y: -30px;
        }

        /* ---------- Scrollbar ---------- */
        html {
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow-x: hidden;
            overflow-y: auto;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        /* ---------- Body ---------- */
        body {
            width: 100%;
            min-height: 100vh;
            background-color: #faf8f5;
            color: #1a1a1a;
            cursor: none;
            font-family: 'Geist Pixel', 'Geist Mono', monospace;

            overflow-x: hidden;
            overflow-y: auto;

            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* ---------- Interactive Elements ---------- */
        a, button, input, textarea, select, [role="button"] {
            cursor: none !important;
        }

        /* ---------- Language Switcher (Flag only, top-right) ---------- */
        .lang-switcher {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
        }

        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px; /* invisible padding for better touch/click target */
            font-size: 1.5rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: none !important;
            border-radius: 0;
        }

        .lang-btn:hover {
            transform: scale(1.15);
            opacity: 0.85;
        }

        .lang-btn:active {
            transform: scale(0.95);
        }

        /* ---------- Main Container ---------- */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        /* ---------- Typography ---------- */
        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* ---------- Bio ---------- */
        .bio {
            max-width: 800px;
        }

        .bio p {
            font-size: 1.15rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 1.25rem;
            font-weight: 400;
        }

        .bio p:last-child {
            margin-bottom: 0;
        }

        /* ---------- Call to Action ---------- */
        .cta-button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 14px 28px;
            background-color: #1a1a1a;
            color: #faf8f5;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 500;
            border: 1px solid #1a1a1a;
            border-radius: 0;
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            background-color: transparent;
            color: #1a1a1a;
        }

        /* ---------- Sections ---------- */
        .section {
            max-width: 800px;
            margin-top: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
        }

        /* ---------- Socials ---------- */
        .socials-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            list-style: none;
        }

        .socials-list a {
            font-size: 1.15rem;
            color: #444;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .socials-list a:hover {
            color: #1a1a1a;
        }

        /* ---------- Experience ---------- */
        .experience-item {
            margin-bottom: 2rem;
        }

        .experience-item:last-child {
            margin-bottom: 0;
        }

        .experience-item .role {
            font-size: 1.15rem;
            color: #1a1a1a;
            font-weight: 400;
            margin-bottom: 0.25rem;
        }

        .experience-item .company {
            font-size: 1.15rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 0.25rem;
        }

        .experience-item .date {
            font-size: 1rem;
            color: #666;
        }

        /* ---------- Text Selection ---------- */
        ::selection {
            background-color: #1a1a1a;
            color: #faf8f5;
        }

        ::-moz-selection {
            background-color: #1a1a1a;
            color: #faf8f5;
        }

        /* ---------- Custom Cursor ---------- */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;

            width: var(--cursor-width);
            height: var(--cursor-height);

            background-image: var(--cursor-image);
            background-size: contain;
            background-position: top left;
            background-repeat: no-repeat;

            pointer-events: none;
            z-index: 99999;

            transform: translate(
                calc(-1 * var(--cursor-hotspot-x)),
                calc(-1 * var(--cursor-hotspot-y))
            );

            will-change: transform;
            display: block;
        }

        /* ---------- Cursor Hover State ---------- */
        .custom-cursor.hover {
            background-image: var(--cursor-click-image);
        }

        .custom-cursor.hidden {
            display: none;
        }

        /* ---------- Toto Animation Container ---------- */
        .toto-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            z-index: 99998;
            pointer-events: auto;
            user-select: none;
            cursor: none;
        }

        .toto-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-user-drag: none;
            user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
        }

        /* ---------- Toto Bark Popup ---------- */
        .bark-popup {
            position: fixed;
            z-index: 99999;
            font-size: 0.85rem;
            color: #1a1a1a;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            animation: bark-float 1.2s ease-out forwards;
        }

        @keyframes bark-float {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.6);
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -10px) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--drift)), -70px) scale(1);
            }
        }

        /* ---------- Responsive: Tablet ---------- */
        @media (max-width: 900px) {
            h1 {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 1.3rem;
            }

            .container {
                padding: 30px;
            }
        }

        /* ---------- Responsive: Mobile ---------- */
        @media (max-width: 768px) {
            body {
                cursor: auto;
                padding-top: 6vh;
                padding-bottom: 6vh;
            }

            .custom-cursor {
                display: none !important;
            }

            a, button, input, textarea, select, [role="button"] {
                cursor: pointer !important;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 2.4rem;
            }

            .subtitle {
                font-size: 1.15rem;
                margin-bottom: 1.5rem;
            }

            .bio p {
                font-size: 1rem;
                margin-bottom: 1rem;
            }

            .cta-button {
                font-size: 1rem;
                padding: 12px 24px;
                margin-top: 1rem;
            }

            .section {
                margin-top: 2rem;
            }

            .section-title {
                font-size: 1.25rem;
                margin-bottom: 1rem;
            }

            .socials-list {
                gap: 1rem;
            }

            .socials-list a {
                font-size: 1rem;
            }

            .experience-item {
                margin-bottom: 1.5rem;
            }

            .experience-item .role,
            .experience-item .company {
                font-size: 1rem;
            }

            .experience-item .date {
                font-size: 0.9rem;
            }

            .toto-container {
                width: 48px;
                height: 48px;
                bottom: 20px;
                right: 20px;
            }

            .lang-switcher {
                top: 16px;
                right: 16px;
            }

            .lang-btn {
                font-size: 1.3rem;
            }
        }

        /* ---------- Responsive: Small Mobile ---------- */
        @media (max-width: 480px) {
            body {
                padding-top: 4vh;
                padding-bottom: 4vh;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .bio p {
                font-size: 0.95rem;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .socials-list {
                flex-direction: column;
                gap: 0.75rem;
            }
        }

        /* ---------- Hide Cursor on Touch Devices ---------- */
        @media (hover: none) and (pointer: coarse) {
            body {
                cursor: auto;
            }

            .custom-cursor {
                display: none !important;
            }

            a, button, input, textarea, select, [role="button"] {
                cursor: pointer !important;
            }
        }

        /* ---------- Loader ---------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #faf8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.6s ease;
            font-size: 1rem;
            color: #666;
        }

        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* ---------- Page starts hidden, fades in ---------- */
        body:not(.loaded) .container {
            opacity: 0;
        }

        body:not(.loaded) .toto-container {
            opacity: 0;
        }

        body:not(.loaded) .lang-switcher {
            opacity: 0;
        }

        .container,
        .toto-container,
        .lang-switcher {
            transition: opacity 0.8s ease;
        }

    </style>
<base target="_blank">
</head>
<body>
    <div id="loader">
        <span>loading...</span>
    </div>

    <!-- Language Switcher (Single Flag Toggle) -->
    <div class="lang-switcher">
        <button class="lang-btn" id="langBtn" aria-label="Toggle language">🇬🇧</button>
    </div>

    <div class="container">
        <h1>Collin Beurskens</h1>
        
        <div class="subtitle" id="subtitle">UI/UX Developer</div>
        
        <div class="bio">
            <p id="bio-p1"></p>
            <p id="bio-p2"></p>
            
            <!-- Work with me Button -->
            <a href="mailto:cmwjbeurskens@gmail.com" class="cta-button" id="cta-button">Work with me</a>
        </div>

        <!-- Socials Section -->
        <div class="section">
            <div class="section-title" id="socials-title">Socials</div>
            <ul class="socials-list">
                <li><a href="https://github.com/CollinBeurskens" target="_blank" id="social-github">GitHub</a></li>
                <li><a href="https://x.com/collinotje" target="_blank" id="social-twitter">Twitter</a></li>
                <li><a href="mailto:cmwjbeurskens@gmail.com" id="social-email">Email</a></li>
            </ul>
        </div>

        <!-- School Section -->
        <div class="section">
            <div class="section-title" id="education-title">Education</div>
            <div class="experience-item">
                <div class="role" id="edu-role">HAVO – Year 3</div>
                <div class="company" id="edu-company">Trevianum</div>
                <div class="date">2023/2024</div>
            </div>
        </div>
    </div>

    <div class="custom-cursor" id="cursor"></div>

    <!-- Toto Animation Element -->
    <div class="toto-container">
        <img src="images/Toto/1.svg" alt="Toto" id="toto-image" class="toto-image">
    </div>

    <script>

        /* ---------- Translations ---------- */
        const translations = {
            en: {
                subtitle: "UI/UX Developer",
                bioP1: (age) => `hey, im collin. im ${age} years old and i've been designing and building websites for around 2 years. i started out experimenting with HTML and CSS and gradually got more into web design and development.`,
                bioP2: `i enjoy creating websites that look good, feel right and actually work well. im always working on new projects, trying things out and learning something new along the way.`,
                cta: "Work with me",
                socialsTitle: "Socials",
                educationTitle: "Education",
                eduRole: "HAVO – Year 3",
                eduCompany: "Trevianum",
                github: "GitHub",
                twitter: "Twitter",
                email: "Email",
                btnFlag: "🇬🇧"
            },
            nl: {
                subtitle: "UI/UX Ontwikkelaar",
                bioP1: (age) => `hey, ik ben collin. ik ben ${age} jaar en ik ontwerp en bouw nu al zo'n 2 jaar websites. ik begon met experimenteren met HTML en CSS en raakte steeds meer geïnteresseerd in webdesign en ontwikkeling.`,
                bioP2: `ik vind het leuk om websites te maken die er goed uitzien, goed aanvoelen en ook echt goed werken. ik ben altijd bezig met nieuwe projecten, dingen uitproberen en onderweg iets nieuws leren.`,
                cta: "Werk met mij",
                socialsTitle: "Socials",
                educationTitle: "Opleiding",
                eduRole: "HAVO – Leerjaar 3",
                eduCompany: "Trevianum",
                github: "GitHub",
                twitter: "Twitter",
                email: "E-mail",
                btnFlag: "🇳🇱"
            }
        };

        let currentLang = localStorage.getItem('preferredLanguage') || 'en';

        function updateContent(lang) {
            const t = translations[lang];
            const age = getAge();
            
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('bio-p1').textContent = t.bioP1(age);
            document.getElementById('bio-p2').textContent = t.bioP2;
            document.getElementById('cta-button').textContent = t.cta;
            document.getElementById('socials-title').textContent = t.socialsTitle;
            document.getElementById('education-title').textContent = t.educationTitle;
            document.getElementById('edu-role').textContent = t.eduRole;
            document.getElementById('edu-company').textContent = t.eduCompany;
            document.getElementById('social-github').textContent = t.github;
            document.getElementById('social-twitter').textContent = t.twitter;
            document.getElementById('social-email').textContent = t.email;
            document.getElementById('langBtn').textContent = t.btnFlag;
            
            document.documentElement.lang = lang;
            localStorage.setItem('preferredLanguage', lang);
            currentLang = lang;
        }

        /* ---------- Load & Fade In ---------- */
        window.addEventListener('load', async () => {
            await Promise.race([
                document.fonts.ready,
                new Promise(r => setTimeout(r, 2000))
            ]);

            updateContent(currentLang);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.getElementById('loader').classList.add('fade-out');
                    document.body.classList.add('loaded');
                });
            });
        });

        /* ---------- Dynamic Age ---------- */
        function getAge() {
            const birthDate = new Date('2010-12-29');
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        /* ---------- Language Toggle Logic ---------- */
        const langBtn = document.getElementById('langBtn');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const newLang = currentLang === 'en' ? 'nl' : 'en';
            updateContent(newLang);
        });

        /* ---------- Disable right-click ---------- */
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        /* ---------- Prevent dragging ---------- */
        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
        });

        /* ---------- Disable zoom (mobile) ---------- */
        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', (e) => {
            e.preventDefault();
        });

        document.addEventListener('dblclick', (e) => {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        /* ---------- Cursor Logic ---------- */
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        if (!isTouchDevice) {
            const cursor = document.getElementById('cursor');
            
            let mouseX = -1000;
            let mouseY = -1000;
            let cursorX = -1000;
            let cursorY = -1000;
            let isFirstMove = true;
            const ease = 0.25;

            document.addEventListener('mousemove', (e) => {
                if (isFirstMove) {
                    cursorX = e.clientX;
                    cursorY = e.clientY;
                    isFirstMove = false;
                }
                
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursor.classList.remove('hidden');
            });

            document.documentElement.addEventListener('pointerleave', () => {
                cursor.classList.add('hidden');
            });

            document.documentElement.addEventListener('pointerenter', () => {
                cursor.classList.remove('hidden');
            });

            window.addEventListener('blur', () => {
                cursor.classList.add('hidden');
            });

            function animateCursor() {
                cursorX += (mouseX - cursorX) * ease;
                cursorY += (mouseY - cursorY) * ease;
                cursor.style.transform = `translate(${cursorX - 8}px, ${cursorY - 5}px)`;
                requestAnimationFrame(animateCursor);
            }
            animateCursor();

            const interactiveSelector = 'a, button, input, textarea, select, [role="button"]';

            document.addEventListener('mouseover', (e) => {
                if (e.target.closest(interactiveSelector)) {
                    cursor.classList.add('hover');
                }
            });

            document.addEventListener('mouseout', (e) => {
                if (!e.relatedTarget || !e.relatedTarget.closest(interactiveSelector)) {
                    cursor.classList.remove('hover');
                }
            });
        }

        /* ---------- Toto Animation Logic ---------- */
        const totoImages = ['images/Toto/1.svg', 'images/Toto/2.svg'];
        let totoIndex = 0;
        const totoImageEl = document.getElementById('toto-image');
        
        setInterval(() => {
            totoIndex = (totoIndex + 1) % totoImages.length;
            totoImageEl.src = totoImages[totoIndex];
        }, 300);

        /* ---------- Toto Bark on Click ---------- */
        const barks = ['bark!', 'woof!', 'arf!', '*growling*', 'woof woof!', '*tail wag*', 'bork!', 'ruff!'];

        document.querySelector('.toto-container').addEventListener('click', () => {
            const popup = document.createElement('span');
            popup.className = 'bark-popup';
            popup.textContent = barks[Math.floor(Math.random() * barks.length)];

            const rect = totoImageEl.getBoundingClientRect();
            popup.style.left = `${rect.left + rect.width / 2}px`;
            popup.style.top = `${rect.top - 6}px`;
            popup.style.setProperty('--drift', `${(Math.random() * 30 - 15).toFixed(0)}px`);

            document.body.appendChild(popup);

            popup.addEventListener('animationend', () => popup.remove());
        });
    </script>
</body>
</html>
